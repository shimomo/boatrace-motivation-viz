version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels: ["dependencies", "github-actions"]
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels: ["dependencies", "javascript"]
    open-pull-requests-limit: 10
    ignore:
      # ts-jest が TypeScript 7 に未対応（peer typescript <7）のため、メジャー更新は止める
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: "development"
